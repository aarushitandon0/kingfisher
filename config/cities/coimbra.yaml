# Coimbra, Portugal - primary site (Mondego tributaries).
# Adding a city should require a file like this plus a land-cover adapter, nothing else.

city: coimbra
name: Coimbra
country: PT
reach_id_prefix: CMB

# Study area. Lower Mondego through Coimbra, including the tributaries
# (Ribeira de Coselhas, Vale das Flores) and enough main channel to give the
# observability gate some wide reaches to work with.
bbox:
  min_lon: -8.5200
  min_lat: 40.1500
  max_lon: -8.3400
  max_lat: 40.2800

crs:
  storage: EPSG:4326        # everything in PostGIS
  metric: EPSG:3763         # ETRS89 / Portugal TM06 - lengths, buffers, areas

timezone: Europe/Lisbon

network:
  source: osm                       # osm | eu_hydro
  waterway_tags: [river, stream, canal]
  # Study-area size knob. The full OSM extract for this bbox is ~222 km of channel over
  # 682 reaches, most of it order-1 field ditches that are neither observable at 10 m nor
  # interesting to a river manager. min_strahler: 2 keeps the Mondego, the canals and the
  # named tributaries the bbox was drawn for (Coselhas, Antanhol, Eiras, Ceira) and drops
  # the ditches. Raise to 3 to shrink the PU bill further - that loses Coselhas and
  # Antanhol, so do it only deliberately.
  min_strahler: 2
  reach_length_m:
    target: 350
    min: 200
    max: 500

observability:
  # observable = median_water_pixels >= min_water_pixels. Tune on Day 1.
  min_water_pixels: 5
  max_cloud_fraction: 0.2

satellite:
  collection: sentinel-2-l2a
  start_date: 2016-01-01
  bands: [B02, B03, B04, B05, B08, B11, SCL]

weather:
  archive_start: 2016-01-01
  # Days fetched BEFORE archive_start so api_30 and antecedent_dry_days are fully
  # defined from archive_start onward. A Portuguese summer dry spell can run 100+ days.
  spinup_days: 365
  # Catchment centroids are snapped to this grid before querying. Open-Meteo's archive
  # is ERA5-Land (0.1 deg) / ERA5 (0.25 deg): points inside one cell get one cell's
  # weather anyway, and querying every centroid separately would cost ~35x the daily
  # Open-Meteo call quota for no extra information.
  query_grid_deg: 0.1
  forecast_days: 10
  # Query point is the centroid of each reach's upstream catchment, not the reach.
  variables:
    - precipitation
    - temperature_2m
    - soil_moisture_0_to_7cm
    - et0_fao_evapotranspiration
    - relative_humidity_2m
    - wind_speed_10m

static_attributes:
  land_cover_adapter: clms          # CLMS Imperviousness / Riparian Zones / Urban Atlas (EU only)
  land_cover_fallback: worldcover      # used, loudly, while CLMS files are not on disk
  # Imperviousness / land cover layer year closest to this is used.
  reference_year: 2021
  population_source: ghsl
  alan_source: viirs
  # OSM highway classes counted in road_density_km_km2. Motorised classes only: the
  # attribute is a traffic-derived pollutant-load proxy, and footways, paths and tracks
  # carry no traffic. Change here, not in code.
  road_classes: [motorway, motorway_link, trunk, trunk_link, primary, primary_link,
                 secondary, secondary_link, tertiary, tertiary_link, unclassified,
                 residential, living_street, service]
  # WorldCover riparian width: vegetated share of a corridor this wide either side of
  # every channel in the catchment, expressed in metres.
  riparian_corridor_m: 100

ground_truth:
  source: snirh
  station_ids: []                   # filled on Day 0 from snirh.apambiente.pt

exposure:
  buffer_m: 250

# Populated by pipeline/l0_network.py. Empty until L0 has run.
reaches: []
