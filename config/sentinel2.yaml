# Sentinel-2 L1 retrieval parameters (pipeline/l1_satellite.py).
#
# Everything here is compiled INTO the evalscript, and the evalscript hash is part of
# every Statistical API cache key. Changing a number below therefore re-requests every
# (reach, year) chunk and re-spends processing units. Change deliberately.

collection: sentinel-2-l2a
resolution_m: 10

# Bands requested per acquisition. B02 is not used by any stored index; its water-pixel
# mean is kept in the interim parquet as a QA reflectance.
bands: [B02, B03, B04, B05, B08, B11, SCL]

# Scene classification (SCL) classes.
scl:
  cloud: [3, 8, 9, 10]         # cloud shadow, cloud medium/high probability, thin cirrus
  invalid: [0, 1]              # no data, saturated/defective
  water: 6

geometry:
  # Water indices: centreline buffered 15 m each side (a 30 m corridor). This is the
  # SAME corridor the Day-1 observability gate measured, so water_pixel_count here and
  # reaches.observable describe the same ground.
  water_half_width_m: 15
  # Riparian NDVI: centreline buffered 30 m each side, water pixels excluded per pixel
  # (MNDWI > 0 OR SCL = WATER), cloud/shadow excluded.
  riparian_half_width_m: 30

# Nechad-type single-band turbidity index: T = A * rho / (1 - rho / C), rho = B04.
# Displayed everywhere as "turbidity index" (dimensionless). It is not reported in any
# turbidity unit - see the caveats.
#
# Algorithm: Nechad, B., Ruddick, K. G. & Neukermans, G. (2009). Calibration and
#   validation of a generic multisensor algorithm for mapping of turbidity in coastal
#   waters. Proc. SPIE 7473, 74730H. doi:10.1117/12.830700
# Coefficients: the Sentinel-2 MSI band B4 (665 nm) turbidity row of ACOLITE's Nechad
#   calibration table (coefficients provided by B. Nechad 2016-09, tabulated by
#   Q. Vanhellemont 2016-10), line "TUR  MSI  B4  665  366.14  0.19563":
#     repository  https://github.com/acolite/acolite
#     file        data/Shared/algorithms/Nechad/Nechad_calibration_201609.txt
#     commit      d61c8de5be005dd050b4df3a5742815d014a200e  (2026-09-09)
#   These replace the Dogliotti et al. (2015) red-band coefficients (A 228.1,
#   C 0.1641), which were calibrated at 645 nm (MODIS), not at S2 B04's 665 nm.
#
# CAVEATS - why this is an index and not a calibrated turbidity:
#   * ACOLITE applies these to water-leaving reflectance (rho_w) after its own
#     aquatic atmospheric correction; L2A here is Sen2Cor BOA reflectance, a land
#     correction. The band now matches; the input quantity still does not.
#   * narrow urban channels are mixed pixels (MASTERSPEC 6.1)
#   * no in-situ calibration against Coimbra turbidity measurements exists
nechad:
  A: 366.14
  C: 0.19563
  citation:
    repository: https://github.com/acolite/acolite
    file: data/Shared/algorithms/Nechad/Nechad_calibration_201609.txt
    commit: d61c8de5be005dd050b4df3a5742815d014a200e
    row: "TUR MSI B4 665 366.14 0.19563"
  # Above this fraction of C the denominator collapses and T diverges; such pixels are
  # excluded from the turbidity mean and counted.
  max_rho_fraction_of_C: 0.9

quality:
  # Per-acquisition rules. min_water_pixels and max_cloud_fraction are read from the
  # city config's `observability` block, so the per-date rule and the per-reach gate
  # cannot drift apart.
  #
  # A date is OUT_OF_RANGE when fewer than this fraction of its water pixels have a
  # valid (non-diverging) Nechad value, or when any mean index leaves its physical domain.
  min_turbidity_valid_fraction: 0.5
  riparian_min_pixels: 10

plan:
  # What a full L1 run requests, in this order. A --max-pu cap stops the run before the
  # batch that would cross it, so whatever comes last is what a short budget loses.
  water:
    # Water indices only where Sentinel-2 can see water (reaches.observable = true, the
    # Day-1 gate). Driver-only reaches return NO_WATER_PIXELS on every date - paying for
    # that told us nothing we did not already know.
    observable_only: true
    # Recent years first (they are the validation and test folds, and the live-model
    # context), then back through the training years.
    years: [2024, 2025, 2026, 2023, 2022, 2021, 2020, 2019, 2018]
  riparian:
    # Riparian NDVI is a slow, seasonal attribute: one narrow midsummer window per reach
    # per year, every reach (observable or not - the buffer is land). Summarised as the
    # median over clear acquisitions in the window, into riparian_ndvi_window.
    years: [2024, 2025, 2026, 2023, 2022, 2021, 2020, 2019, 2018]
    window: ["07-01", "07-31"]
  # 2016-2017 (S2A only, pre-S2B, older processing baselines) is probed on ONE reach and
  # reported before anyone pays for it on all of them.
  pre_2018_probe:
    years: [2016, 2017]

requests:
  # One request per (reach, calendar year): a completed year is an immutable cache key
  # and is never re-requested. The current year's chunk ends "today", so it is
  # re-requested once per day that the pipeline runs.
  chunk: year
  batch_size: 16
  max_threads: 4
  max_attempts: 6
  backoff_base_s: 2.0
  backoff_max_s: 120.0
